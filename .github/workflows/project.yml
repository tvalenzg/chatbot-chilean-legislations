# Workflow name
name: Python Lint and Format ETL

on:
  push:
    branches: [ '*' ]
    paths:
      - 'etl/**'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'etl/**'

jobs:
  lint-and-format-etl:
    name: 'Python Lint and Format (ETL)'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./etl

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 3. Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            etl/.venv 
            # FIX: The path to the virtual environment must include 'etl/'
            # because that's where 'uv sync' will create it.
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: 4. Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        working-directory: . 

      # This command will now run inside the 'etl' directory and succeed.
      - name: 5. Install dependencies
        run: uv sync
        
      - name: 6. Run linters
        run: uv run ruff check .

      # FIX: Same as the linter step.
      - name: 7. Check formatting
        run: uv run ruff format . --check